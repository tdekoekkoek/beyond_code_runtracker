on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:coverage

            - name: Build application
              run: npm run build

    containerize:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup docker/buildx
              uses: docker/setup-buildx-action@v3

            -   name: Build and push Docker image
                uses: docker/build-push-action@v5
                with:
                    context: .
                    file: ./Containerfile
                    push: true
                    tags: |
                        ${{ secrets.ACR_NAME }}.azurecr.io/runtracker-tdk:${{ github.sha }}
                        ${{ secrets.ACR_NAME }}.azurecr.io/runtracker-tdk:latest
